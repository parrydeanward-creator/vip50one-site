<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Client Portal Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@400;700;900&family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<style>
/* Layout: a switcher bar over two worlds. Client screens wear the team site (black bar, white page, gold);
   agent screens wear the Brain (navy glass). Single committed look per world, set explicitly. */
:root {
  color-scheme: light;
  --ink: #141414; --paper: #ffffff; --wash: #f6f4ef; --line: #e6e1d6; --muted: #6b665c;
  --gold: #c59d45; --gold-d: #9c7a2e; --good: #2f8f5b; --warn: #c9861a; --red: #c8463b;
  --navy: #070b1c; --card: #0e1532; --nline: #1f2a55; --ntext: #eef1fb; --ndim: #8f99bb; --ngold: #f2c94c; --nred: #ff6b5f; --nblue: #5b9cf5; --ngreen: #3ccf8e;
  --serif: "Playfair Display", Georgia, serif; --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
  --disp: "Bebas Neue", "Oswald", Impact, sans-serif; --ui: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: #0b0b0b; }
body { font-family: var(--sans); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* switcher */
.sw { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #0b0b0b; border-bottom: 1px solid #2a2a2a; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.sw h1 { font-family: var(--ui); font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #d9d2c2; margin: 0 8px 0 0; text-transform: uppercase; }
.sw .grp { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sw .grp span { font: 600 10px var(--ui); letter-spacing: .14em; color: #8a8478; text-transform: uppercase; margin-right: 2px; }
.sw button { font: 600 12.5px var(--ui); color: #d9d2c2; padding: 7px 12px; border-radius: 999px; border: 1px solid #333; }
.sw button.on { background: var(--gold); color: #141414; border-color: var(--gold); }
.ex { margin-left: auto; font: 700 10px var(--ui); letter-spacing: .12em; color: #141414; background: #f2c94c; padding: 4px 9px; border-radius: 4px; }
.note { background: #141414; color: #cfc8b8; font: 13.5px/1.55 var(--ui); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid #2a2a2a; }
.note b { color: #fff; }

/* ---------- client world ---------- */
.cw { background: var(--wash); min-height: 80vh; }
.c-head { background: #1b1b1b; color: #fff; display: flex; align-items: center; gap: 20px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.c-head nav { display: flex; gap: 22px; font: 700 12px var(--sans); letter-spacing: .12em; }
.c-logo { font-family: var(--serif); font-size: 24px; color: var(--gold); letter-spacing: .02em; margin: 0 auto; }
.c-logo small { display: block; font: 700 8px var(--sans); letter-spacing: .5em; color: #bfb6a2; text-align: center; margin-top: -2px; }
.c-acct { display: flex; align-items: center; gap: 8px; border: 1px solid var(--gold); color: #fff; padding: 7px 12px 7px 7px; border-radius: 999px; font: 700 12px var(--sans); letter-spacing: .06em; }
.c-acct i { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #141414; display: grid; place-items: center; font-style: normal; font-size: 11px; }
@media (max-width: 860px) { .c-head nav { display: none; } .c-logo { margin: 0; } .c-acct { margin-left: auto; } }

.c-body { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr) 290px; gap: 24px; padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 1100px) { .c-body { grid-template-columns: 200px minmax(0, 1fr); } .c-rail { grid-column: 1 / -1; } }
@media (max-width: 760px) { .c-body { grid-template-columns: minmax(0, 1fr); } }
.c-nav { display: grid; gap: 2px; align-content: start; position: sticky; top: 70px; }
@media (max-width: 760px) { .c-nav { position: static; grid-auto-flow: column; overflow-x: auto; gap: 6px; } }
.c-nav button { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-radius: 8px; font: 700 13.5px var(--sans); color: #3a362f; white-space: nowrap; gap: 10px; }
.c-nav button.on { background: #1b1b1b; color: #fff; }
.c-nav button em { font-style: normal; font: 900 11px var(--sans); background: var(--gold); color: #141414; border-radius: 999px; padding: 1px 7px; }
.c-nav .who { font: 700 10.5px var(--sans); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; padding: 4px 14px 10px; }
@media (max-width: 760px) { .c-nav .who { display: none; } }

.c-main { min-width: 0; display: grid; gap: 18px; align-content: start; }
.hello h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; margin: 0; text-wrap: balance; }
.hello p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font: 900 11.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold-d); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel h3 a, .panel h3 button { font: 700 12.5px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.next { background: #1b1b1b; color: #fff; border-radius: 12px; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.next .when { font-family: var(--serif); font-size: 15px; color: var(--gold); text-align: center; line-height: 1.1; border-right: 1px solid #3a3a3a; padding-right: 16px; }
.next .when b { display: block; font-size: 30px; color: #fff; font-weight: 400; }
.next p { margin: 0; } .next p.s { color: #bdb6a6; font-size: 13.5px; margin-top: 3px; }
@media (max-width: 560px) { .next { grid-template-columns: auto minmax(0, 1fr); } .next .btn { grid-column: 1 / -1; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 900 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 11px 16px; border-radius: 6px; background: var(--gold); color: #141414; white-space: nowrap; }
.btn.ghost { background: transparent; border: 1px solid currentColor; }
.btn.dark { background: #1b1b1b; color: #fff; }

/* journey */
.journey { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.step { position: relative; padding-top: 30px; font-size: 12.5px; color: var(--muted); }
.step::before { content: ""; position: absolute; top: 9px; left: 0; right: -6px; height: 3px; background: var(--line); }
.step:last-child::before { right: 0; }
.step i { position: absolute; top: 0; left: 0; width: 21px; height: 21px; border-radius: 50%; background: var(--paper); border: 3px solid var(--line); z-index: 1; }
.step.done::before, .step.done i { background: var(--gold); border-color: var(--gold); }
.step.now i { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(197, 157, 69, .22); }
.step.now { color: var(--ink); font-weight: 700; }
.step b { display: block; color: var(--ink); font-size: 13.5px; }
@media (max-width: 560px) { .journey { grid-template-columns: repeat(5, minmax(56px, 1fr)); overflow-x: auto; } }

/* homes */
.homes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .homes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .homes { grid-template-columns: minmax(0, 1fr); } }
.home { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); display: grid; }
.ph { aspect-ratio: 16 / 10; max-width: 100%; position: relative; }
.ph .tag { position: absolute; left: 10px; top: 10px; font: 900 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; background: #1b1b1b; color: #fff; padding: 4px 8px; border-radius: 4px; }
.ph .tag.drop { background: var(--good); }
.ph .heart { position: absolute; right: 10px; top: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; font-size: 16px; color: var(--red); }
.home .b { padding: 12px 14px 14px; display: grid; gap: 4px; }
.home .p { font: 900 19px var(--sans); }
.home .a { font-size: 13.5px; color: #3a362f; }
.home .f { font-size: 12.5px; color: var(--muted); }
.home .why { margin-top: 6px; font-size: 12.5px; background: var(--wash); border-left: 3px solid var(--gold); padding: 7px 9px; border-radius: 0 6px 6px 0; }
.home .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.home .acts button { font: 700 12px var(--sans); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }

/* rows */
.rows { display: grid; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .d { width: 48px; text-align: center; font-family: var(--serif); color: var(--gold-d); font-size: 12px; line-height: 1.05; }
.row .d b { display: block; font-size: 22px; color: var(--ink); font-weight: 400; }
.row .t { font-weight: 700; } .row .s { font-size: 13px; color: var(--muted); }
.pill { font: 900 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: #e3f3ea; color: var(--good); } .pill.due { background: #fbefd9; color: #8a5a07; } .pill.late { background: #f8e1de; color: var(--red); } .pill.wait { background: #eeeae1; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 18px; height: 18px; accent-color: var(--gold-d); margin-top: 2px; flex: none; }
.check .s { font-size: 13px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.stat b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 400; }
.stat span { font: 700 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat em { display: block; font-style: normal; font-size: 12.5px; color: var(--good); margin-top: 2px; }
.bigval { font-family: var(--serif); font-size: 44px; line-height: 1; }
.range { position: relative; height: 10px; background: var(--wash); border-radius: 5px; margin: 14px 0 6px; }
.range span { position: absolute; top: 0; bottom: 0; background: linear-gradient(90deg, #e9d9b2, var(--gold)); border-radius: 5px; }
.range i { position: absolute; top: -5px; width: 4px; height: 20px; background: var(--ink); border-radius: 2px; }
.small { font-size: 12.5px; color: var(--muted); }

/* messages */
.msgs { display: grid; gap: 10px; }
.bub { max-width: 78%; padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.bub.them { background: var(--wash); border: 1px solid var(--line); }
.bub.me { background: #1b1b1b; color: #fff; justify-self: end; }
.bub small { display: block; font-size: 11px; opacity: .65; margin-top: 4px; }
.compose { display: flex; gap: 8px; margin-top: 12px; }
.compose input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px; font: inherit; }

/* right rail */
.c-rail { display: grid; gap: 16px; align-content: start; }
.agent { background: #1b1b1b; color: #fff; border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.agent .top { display: flex; gap: 12px; align-items: center; }
.agent .face { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #6d5521); display: grid; place-items: center; font-family: var(--serif); font-size: 20px; color: #141414; flex: none; }
.agent .nm { font-family: var(--serif); font-size: 19px; } .agent .rl { font-size: 12.5px; color: #bdb6a6; }
.agent .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.agent .acts button { border: 1px solid #3c3c3c; border-radius: 6px; padding: 9px 4px; font: 700 12px var(--sans); text-align: center; }
.agent .acts button:first-child { background: var(--gold); color: #141414; border-color: var(--gold); }
.agent .num2 { font-size: 12.5px; color: #bdb6a6; user-select: all; }
.askp { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.askp h4 { margin: 0 0 8px; font: 900 11.5px var(--sans); letter-spacing: .16em; color: var(--gold-d); }
.askp .q { display: flex; flex-wrap: wrap; gap: 6px; }
.askp .q button { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.askp input { width: 100%; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: inherit; }
.ans { margin-top: 10px; font-size: 13.5px; background: var(--wash); border-radius: 8px; padding: 10px 12px; line-height: 1.5; }
.team { font-size: 13px; display: grid; gap: 8px; }
.team div { display: flex; justify-content: space-between; gap: 10px; }
.team div span:last-child { color: var(--muted); text-align: right; }

/* phone frame */
.phwrap { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; padding-block: 30px 50px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--wash); }
.phone { width: 360px; max-width: 100%; height: 740px; border-radius: 44px; background: #111; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: var(--wash); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.p-top { background: #1b1b1b; color: #fff; padding: 22px 18px 14px; }
.p-top .l { font-family: var(--serif); color: var(--gold); font-size: 18px; }
.p-top h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 8px 0 0; }
.p-body { overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; }
.p-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 8px 4px 14px; }
.p-tabs button { text-align: center; font: 700 10.5px var(--sans); color: var(--muted); display: grid; gap: 3px; justify-items: center; }
.p-tabs button.on { color: var(--gold-d); }
.p-tabs svg { width: 22px; height: 22px; }
.phcap { max-width: 320px; font: 14px/1.6 var(--ui); color: #3a362f; align-self: center; }
.phcap h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0 0 10px; }
.phcap li { margin-bottom: 6px; }

/* ---------- agent world ---------- */
.aw { background: var(--navy); color: var(--ntext); font-family: var(--ui); min-height: 80vh; padding-block: 26px 50px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.aw .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
.a-tag { font: 700 11px var(--ui); letter-spacing: .14em; color: var(--ngold); border: 1px solid rgba(242,201,76,.5); border-radius: 999px; padding: 4px 10px; justify-self: start; }
.a-h1 { font-family: var(--disp); font-size: 48px; letter-spacing: .02em; margin: 0; line-height: 1; }
.a-sub { color: var(--ndim); margin: 4px 0 0; font-size: 14.5px; }
.acard { background: var(--card); border: 1px solid var(--nline); border-radius: 14px; padding: 18px; min-width: 0; }
.acard h3 { margin: 0 0 12px; font: 700 11.5px var(--ui); letter-spacing: .16em; color: var(--ndim); text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; }
.agrid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .agrid { grid-template-columns: minmax(0, 1fr); } }
.who-c { display: grid; gap: 12px; }
.who-c .top { display: flex; gap: 12px; align-items: center; }
.av { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--nred); display: grid; place-items: center; font-weight: 700; background: #1b2750; flex: none; }
.who-c .nm { font-family: var(--disp); font-size: 28px; line-height: 1; letter-spacing: .02em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 11.5px var(--ui); padding: 4px 9px; border-radius: 999px; background: #18224a; color: #cfd6ee; }
.chip.hot { background: rgba(255,107,95,.16); color: var(--nred); }
.chip.gold { background: rgba(242,201,76,.14); color: var(--ngold); }
.aacts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ab { border-radius: 10px; padding: 11px 6px; text-align: center; font: 700 13px var(--ui); border: 1px solid rgba(242,201,76,.5); color: var(--ngold); }
.ab.solid { background: var(--ngold); color: #10142a; border-color: var(--ngold); }
.pulse { border: 1px solid rgba(255,107,95,.45); background: rgba(255,107,95,.07); border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.5; }
.pulse b { color: var(--nred); font: 700 11px var(--ui); letter-spacing: .14em; display: block; margin-bottom: 4px; }
.kv { display: grid; gap: 8px; font-size: 13.5px; }
.kv div { display: flex; justify-content: space-between; gap: 10px; }
.kv span:first-child { color: var(--ndim); }
.kv .y { color: var(--ngreen); } .kv .n { color: var(--ngold); }
.astats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .astats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ast { background: #0b1230; border: 1px solid var(--nline); border-radius: 12px; padding: 12px 14px; }
.ast b { display: block; font-family: var(--disp); font-size: 34px; line-height: 1; letter-spacing: .02em; }
.ast span { font: 600 11px var(--ui); letter-spacing: .1em; color: var(--ndim); text-transform: uppercase; }
.ast em { font-style: normal; font-size: 12px; color: var(--ngreen); display: block; margin-top: 2px; }
.spark { width: 100%; height: 70px; display: block; }
.vt { width: 100%; border-collapse: collapse; font-size: 13.5px; color: var(--ntext); font-family: var(--ui); }
.vt td { color: var(--ntext); }
.vt th { text-align: left; font: 600 11px var(--ui); letter-spacing: .1em; color: var(--ndim); text-transform: uppercase; padding: 0 10px 8px 0; }
.vt td { padding: 10px 10px 10px 0; border-top: 1px solid var(--nline); vertical-align: middle; }
.vt td.r, .vt th.r { text-align: right; }
.bar { height: 6px; border-radius: 3px; background: #18224a; overflow: hidden; min-width: 60px; }
.bar span { display: block; height: 100%; background: var(--nblue); }
.tl { display: grid; gap: 0; }
.tl div { display: grid; grid-template-columns: 70px 18px minmax(0, 1fr); gap: 8px; font-size: 13.5px; padding: 6px 0; }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: var(--nblue); margin-top: 5px; }
.tl .tm { color: var(--ndim); font-size: 12.5px; }
.scroll { overflow-x: auto; }
.wl { display: grid; }
.wr { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--nline); }
.wr:first-child { border-top: 0; }
.wr .av { width: 44px; height: 44px; font-size: 13px; }
.wr .t { font-weight: 600; } .wr .s { font-size: 13px; color: var(--ndim); margin-top: 2px; }
.wr .acts { display: flex; gap: 6px; }
.wr .acts button { font: 700 12px var(--ui); padding: 8px 11px; border-radius: 8px; border: 1px solid rgba(242,201,76,.5); color: var(--ngold); }
.wr .acts button.solid { background: var(--ngold); color: #10142a; }
@media (max-width: 600px) { .wr { grid-template-columns: 44px minmax(0, 1fr); } .wr .acts { grid-column: 2; } }
.heat { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

const NOTES = {
  buyer: "<b>Buyer, signed in.</b> One account page. The left menu covers everything; the right side always has the agent and Ask Pulse. Start: what is next, where they are in the journey, new matches with why, price drops on saved homes, and the agent's last message. Try the menu, the hearts and Ask Pulse.",
  contract: "<b>Under contract.</b> The same account becomes the deal: every contract date with a countdown, the client's to-do, and who is who. A date coming up is gold, a done date green, a late one red.",
  seller: "<b>Seller.</b> Listing numbers from Marquee and the site, the open house from ONE Open, showing feedback from Showly, the launch checklist and offers with the net sheet.",
  owner: "<b>Homeowner (past client).</b> Value with a range and where it came from, equity, the improvements log, Trusted Local Pros, and sales on their street. Every card has a next step that goes to the agent.",
  phone: "<b>Phone.</b> The same account as the ONE Home app, with five tabs.",
  contact: "<b>What the agent sees on a contact.</b> Pulse says what to do and why. The account box shows whether they use the site, the app and the Room. The site box shows visits, homes viewed, how often and how long, with a button to act on each.",
  onsite: "<b>Who is on my site.</b> Signed-in people, most active first, each one a tap from a call or text. Site numbers stay anonymous. Try Today, 7 days and 30 days.",
  lead: "<b>Team lead.</b> Every site on the team, by agent: visits, signed-in people, leads and time to reach, with a nudge for slow ones. Team-site visitors waiting to be routed, and the homes the whole team's visitors want.",
};

let cur = "buyer", sub = "home";
function render() {
  $("#note").innerHTML = NOTES[cur];
  document.querySelectorAll(".sw button").forEach((b) => b.classList.toggle("on", b.dataset.v === cur));
  const v = $("#view");
  if (cur === "buyer") v.innerHTML = client(buyerNav, sub, (buyerSubs[sub] || buyerSubs.home)(), buyerRail, "Jessica · buyer");
  else if (cur === "contract") v.innerHTML = client(contractNav, "home", contractMain, agentCard + ask(["What happens at inspection?", "How much cash do I need to close?"]), "Jessica · under contract");
  else if (cur === "seller") v.innerHTML = client(sellerNav, "home", sellerMain, agentCard + ask(["How did my open house go?"]), "Marcus · seller");
  else if (cur === "owner") v.innerHTML = client(ownerNav, "home", ownerMain, agentCard + ask(["What is my home worth now?"]), "The Garcias · homeowners");
  else if (cur === "phone") v.innerHTML = phoneView();
  else if (cur === "contact") v.innerHTML = contactView();
  else if (cur === "onsite") v.innerHTML = onsiteView(render.f || "7 days");
  else if (cur === "lead") v.innerHTML = leadView();
  try { localStorage.setItem("cp-view", cur); } catch {}
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-sub]");
  if (!t) return;
  if (t.dataset.v) { cur = t.dataset.v; sub = "home"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.v2) { cur = t.dataset.v2; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.sub) { if (cur === "buyer") { sub = t.dataset.sub; render(); } else toast("In the full build this opens " + t.textContent.replace(/\d+$/, "")); return; }
  if (t.dataset.go) { if (cur === "buyer") { sub = t.dataset.go; render(); } else toast("Messages open here"); return; }
  if (t.dataset.f) { render.f = t.dataset.f; render(); return; }
  if (t.dataset.heart) { const on = t.innerHTML.includes("9829"); t.innerHTML = on ? "&#9825;" : "&#9829;"; toast(on ? "Removed from saved homes" : "Saved. Parry sees it on your contact"); return; }
  if (t.dataset.ask) { const a = $("#ans"); a.hidden = false; a.textContent = ANSWERS[t.dataset.ask] || "Pulse answers here, and hands it to Parry when it should."; return; }
  if (t.dataset.toast) toast(t.dataset.toast);
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "askq" && e.target.value.trim()) { const a = $("#ans"); a.hidden = false; a.textContent = "Good question. Pulse answers from your account and the market, and sends anything personal to Parry."; } });
try { const s = localStorage.getItem("cp-view"); if (s && NOTES[s]) cur = s; } catch {}
const h = location.hash.slice(1); if (NOTES[h]) cur = h;
render();
</script>
